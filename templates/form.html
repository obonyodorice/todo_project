{% extends "./base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <div class="card shadow-sm rise"><div class="card-body p-4 form-card">
      <h3 class="mb-3">{% if object %}Edit entry ✏️{% else %}New entry ✨{% endif %}</h3>
      {% if object %}<p class="text-muted">{{ object }}</p>{% endif %}
      <form method="post" enctype="multipart/form-data">{% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100">Save</button>
      </form>
      <a href="javascript:history.back()" class="d-block text-center mt-3">Cancel</a>
    </div></div>
  </div>
</div>
{% endblock %}
