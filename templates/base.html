{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Planner</title>
  <script>document.documentElement.dataset.bsTheme = localStorage.getItem("theme") || "light";</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'styles.css' %}" rel="stylesheet">
</head>
{% with student="Grandee" %}
<body data-name="{{ student }}" data-csrf="{{ csrf_token }}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol></svg>
<nav class="navbar navbar-expand-lg sticky-top bg-body-tertiary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">📚 Study Planner</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="{% url 'assignment_list' %}">Assignments</a>
        <a class="nav-link" href="{% url 'exam_list' %}">Exams</a>
        <a class="nav-link" href="{% url 'revisiontopic_list' %}">Revision</a>
        <a class="nav-link" href="{% url 'classsession_list' %}">Timetable</a>
        <a class="nav-link" href="{% url 'result_list' %}">Results</a>
        <a class="nav-link" href="{% url 'resource_list' %}">Resources</a>
        <a class="nav-link" href="{% url 'subject_list' %}">Subjects</a>
        <a class="nav-link" href="{% url 'semester_list' %}">Semesters</a>
      </div>
      <div class="form-check form-switch m-0">
        <input class="form-check-input" type="checkbox" id="theme" role="switch">
        <label class="form-check-label" for="theme">🌙 Dark</label>
      </div>
    </div>
  </div>
</nav>

<main class="container my-4">{% block content %}{% endblock %}</main>
<div id="toast" class="toast-lite"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const name = document.body.dataset.name, csrf = document.body.dataset.csrf;

  // dark mode toggle (remembered)
  const theme = document.getElementById("theme");
  theme.checked = document.documentElement.dataset.bsTheme === "dark";
  theme.onchange = () => {
    const t = theme.checked ? "dark" : "light";
    document.documentElement.dataset.bsTheme = t;
    localStorage.setItem("theme", t);
  };

  // done/not-done switches: save without reloading, then celebrate
  const cheers = [`Nice work, ${name}! `, "One more down, keep going! ", "That's real progress! ✨", "Look at you go! 🚀"];
  const toast = document.getElementById("toast");
  document.addEventListener("change", async e => {
    const box = e.target.closest(".toggle");
    if (!box) return;
    const item = box.closest(".item");
    const res = await fetch(box.dataset.url, { method: "POST", headers: { "X-CSRFToken": csrf } }).catch(() => null);
    if (!res || !res.ok) { box.checked = !box.checked; return; }
    item.classList.toggle("done", box.checked);
    if (!box.checked) return;
    toast.textContent = cheers[Math.floor(Math.random() * cheers.length)];
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
    if ("hide" in item.dataset) { item.classList.add("leave"); setTimeout(() => item.remove(), 400); }
  });
</script>
{% block scripts %}{% endblock %}
</body>
{% endwith %}
</html>
